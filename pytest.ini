[pytest]

pythonpath = .
testpaths = tests

addopts = -ra --strict-markers
    ;     --browser=chromium 
    ;     --headed 
    ;     --slowmo=1500
    ;     --tracing=retain-on-failure
    ;     --screenshot=on
    ;     --video=retain-on-failure

markers =
    api: hits the restful-booker REST API over HTTP; no browser required
    ui: drives a real browser via Playwright
    smoke: minimal critical-path subset
