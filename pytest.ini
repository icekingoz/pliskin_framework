[pytest]
pythonpath = .
testpaths = tests

addopts =
    -ra
    --strict-markers
    --alluredir=allure-results
    --clean-alluredir
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure

markers =
    api: hits the restful-booker REST API over HTTP; no browser required
    ui: drives a real browser via Playwright
    smoke: minimal critical-path subset
