name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Allow the report job to push the generated site to the gh-pages branch.
permissions:
  contents: write

# A second push while a run is in flight cancels the first: two jobs racing to
# push gh-pages is the classic way to corrupt Allure's history.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump deliberately, not automatically -- a report generator that changes
  # under you is a bad thing to debug.
  ALLURE_VERSION: "2.43.0"

jobs:
  # Fast job: pure HTTP, no browsers to install. Finishes in seconds and gives
  # you a signal long before the UI job is done.
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No `playwright install` here on purpose -- that is the whole point of
      # keeping Playwright out of the root conftest.
      - name: Run API tests
        run: >
          python -m pytest tests/api
          -m api
          --junitxml=junit-api.xml
          --html=api-report.html
          --self-contained-html

      # `always()` so the summary is written for failing runs too -- which is
      # precisely when someone wants to read it.
      - name: Job summary
        if: always()
        run: python scripts/junit_summary.py junit-api.xml "API tests"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-results-api
          path: allure-results
          retention-days: 7

      - name: Upload pytest-html report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-report-html
          path: api-report.html

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run UI tests
        run: >
          python -m pytest tests/ui
          --base-url https://www.saucedemo.com
          --browser chromium
          --junitxml=junit-ui.xml
          --html=ui-report.html
          --self-contained-html

      - name: Job summary
        if: always()
        run: python scripts/junit_summary.py junit-ui.xml "UI tests"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-results-ui
          path: allure-results
          retention-days: 7

      - name: Upload pytest-html report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-report-html
          path: ui-report.html

      # Traces, videos and screenshots Playwright wrote for failing tests.
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          path: test-results/

  # Merges both suites into one Allure site and publishes it to gh-pages.
  report:
    name: Publish Allure report
    needs: [api, ui]
    # `always()` matters: a report that only publishes when everything passed is
    # useless, because the run you most want to inspect is the failing one.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Allure results from both suites
        uses: actions/download-artifact@v6
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      # The existing site carries the history that makes trend graphs work.
      # First ever run has no gh-pages branch yet, hence continue-on-error.
      - name: Fetch previous report history
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Restore history into the results
        run: |
          mkdir -p allure-results/history
          if [ -d gh-pages/last-history ]; then
            cp -r gh-pages/last-history/. allure-results/history/
            echo "Carried forward $(ls -1 allure-results/history | wc -l) history files."
          else
            echo "No previous history -- trends start from this run."
          fi

      # Makes the report link back to the run that produced it.
      - name: Describe the executor
        run: |
          PAGES="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          cat > allure-results/executor.json <<JSON
          {
            "name": "GitHub Actions",
            "type": "github",
            "reportName": "${{ github.event.repository.name }}",
            "url": "${PAGES}",
            "reportUrl": "${PAGES}/${{ github.run_number }}/",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildName": "Run #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }}
          }
          JSON

      # Allure's CLI is a Java application.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        run: |
          curl -sSL --retry 3 -o allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf allure.tgz
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate report
        run: allure generate allure-results --clean -o allure-report

      - name: Assemble the site
        run: |
          chmod +x scripts/assemble_allure_site.sh
          scripts/assemble_allure_site.sh \
            allure-report gh-pages site "${{ github.run_number }}" 30

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site

      - name: Link the report from the run page
        if: always()
        run: |
          PAGES="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          {
            echo "## 📊 Allure report"
            echo ""
            echo "- [Latest report](${PAGES}/latest/)"
            echo "- [This run (#${{ github.run_number }})](${PAGES}/${{ github.run_number }}/)"
          } >> "$GITHUB_STEP_SUMMARY"
